        /* Structure de base pour éviter tout débordement */
        html, body {
            height: 100%;

            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }

        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .slide-up { animation: slideUp 0.4s ease-out; }
        .bounce-slight { animation: bounceSlight 2s infinite; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounceSlight { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-6px); } 
        }

        /* Etape 1 : Majuscule et ponctuation */
        .target-part {
            display: inline-block;
            padding: 2px 4px;
            margin: -2px -4px;
            border-radius: 6px;
            transition: all 0.2s ease;
            position: relative;
            z-index: 10;
        }
        .step1-active .target-part { cursor: pointer; }
        .step1-active .target-part:hover { background-color: #fde68a; }
        .target-part.selected-step1 {

            color: #78350f;
            font-weight: 900;
        }

        .circled-lunette {
            display: inline-block;
            border: 3px solid #3b82f6;
            border-radius: 9999px;
            padding: 0px 4px;
            margin: 0 -2px;
            background-color: #eff6ff;
            color: #1e3a8a;
            font-weight: 800;
            position: relative;
            z-index: 20;
        }
        
        /* Etape 4 : Verbe souligné */
        .verb-underlined {
            border-bottom: 4px solid #ef4444;
            color: #991b1b;
            font-weight: 800;
            padding-bottom: 2px;
        }

        .gns-highlight {
            color: #dc2626;
            font-weight: 800;
            background-color: #fee2e2;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .star-doubt {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            color: #eab308;
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            z-index: 30;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Conteneur GN pour SVG */
        .gn-container {
            position: relative;
            display: inline-flex;
            flex-wrap: wrap;
            align-items: baseline;
        }
        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            overflow: visible;
        }
        .path-draw {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawPath 1.5s ease-out forwards;
        }
        @keyframes drawPath { to { stroke-dashoffset: 0; } }

                                <p className="text-gray-700 font-medium leading-relaxed">Je repère l'action ou l'état. Je <span className="border-b-4 border-red-500 text-red-800 font-bold">souligne</span> tous les verbes conjugués dans ma phrase.</p>
                            </div>
                            <div className="bg-orange-50 rounded-2xl p-6 border-2 border-orange-200 shadow-sm hover:shadow-md transition">
                                <div className="flex items-center gap-4 mb-4">
                                    <div className="w-12 h-12 bg-orange-500 text-white rounded-full flex items-center justify-center font-black text-2xl">5</div>
                                    <h3 className="font-extrabold text-xl text-orange-900">Accord du GNS</h3>
                                </div>
                                <p className="text-gray-700 font-medium leading-relaxed">Je pose la question <br/>« <em>Qui est-ce qui... ?</em> ». Je relie le Sujet à son Verbe pour choisir la bonne terminaison.</p>
                            </div>
                            <div className="bg-purple-50 rounded-2xl p-6 border-2 border-purple-200 shadow-sm hover:shadow-md transition">
                                <div className="flex items-center gap-4 mb-4">
                                    <div className="w-12 h-12 bg-purple-500 text-white rounded-full flex items-center justify-center font-black text-2xl">6</div>
                                    <h3 className="font-extrabold text-xl text-purple-900">Le Doute</h3>
                                </div>
                                <p className="text-gray-700 font-medium leading-relaxed">Je place une étoile sur les mots dont l'orthographe me fait douter. Je vérifie ensuite dans mon dictionnaire !</p>
                            </div>
                        </div>

                        <button 
                            onClick={onStartSimulator}
                            className="mt-12 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-2xl py-5 px-12 rounded-2xl shadow-[0_8px_30px_rgb(79,70,229,0.3)] transition transform active:scale-95 flex items-center justify-center gap-4 mx-auto w-full sm:w-auto"
                        >
                            Lancer le simulateur <Icon name="rocket" className="w-8 h-8" />
                        </button>
                    </div>
                </div>
            </div>
        );

        // Simulateur (Onglet 2)
        const SimulatorTab = ({ onFinish }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [currentStep, setCurrentStep] = useState(1);

            // États des sélections
            const [selectedStep1, setSelectedStep1] = useState([]);
            const [selectedStep2, setSelectedStep2] = useState([]);
            const [selectedStep3, setSelectedStep3] = useState([]);
            const [selectedStep4, setSelectedStep4] = useState([]);
            const [selectedStep5, setSelectedStep5] = useState(null);
            const [selectedStep6, setSelectedStep6] = useState([]);

            // États UI Modals
            const [feedback, setFeedback] = useState({ status: 'idle', message: '' });
            const [showDictionary, setShowDictionary] = useState(false);
            const [currentDictWord, setCurrentDictWord] = useState(null);
            const [showConjugation, setShowConjugation] = useState(false);
            const [showReflection, setShowReflection] = useState(false);

            const currentData = SENTENCES_DATA[currentIndex];
            if (!currentData) return <div className="p-10 text-center text-2xl h-full flex items-center justify-center font-bold text-indigo-800">Activité terminée ! Bravo ! 🎉</div>;

            const handleWordClick = (word, event) => {
                // Étape 1 : Majuscule & Ponctuation
                if (currentStep === 1) {
                    const target = event?.target;
                    // On utilise closest pour s'assurer que c'est bien la lettre cliquée
                    const targetPart = target?.closest('.target-part');
                    
                    let clickedType = null;
                    if (targetPart) {
                        const text = targetPart.textContent.trim();
                        if (word.cap && word.cap.includes(text)) {
                            clickedType = `${word.id}-cap`;
                        } else if (word.punc && word.punc.includes(text)) {
                            clickedType = `${word.id}-punc`;
                        }
                    } else {
                        // Tolérance: si on clique sur le mot en général, on vérifie s'il possède une cap
                        if (word.cap && word.id === currentData.words.find(w=>w.cap)?.id) {
                            clickedType = `${word.id}-cap`;
                        } else if (word.punc && word.id === currentData.words.find(w=>w.punc)?.id) {
                            clickedType = `${word.id}-punc`;
                        }
                    }
                    
                    if (clickedType) {
                        setSelectedStep1(prev => prev.includes(clickedType) ? prev.filter(item => item !== clickedType) : [...prev, clickedType]);
                    }
                    return;
                }

                // Étape 2 : Groupes du Nom (GN) - Mots individuels
                if (currentStep === 2) {
                    if (word.gn !== null) {
                        // L'utilisateur doit cliquer sur chaque mot du GN un par un
                        setSelectedStep2(prev => 
                            prev.includes(word.id) ? prev.filter(id => id !== word.id) : [...prev, word.id]
                        );
                    }
                    return;
                }

                // Étape 3 : Accords du Nom (Lunettes)
                if (currentStep === 3) {
                    if (currentData.step3.includes(word.id)) {
                        if (!selectedStep3.includes(word.id)) {
                            const newSelected = [...selectedStep3, word.id];
                            setSelectedStep3(newSelected);
                            if (newSelected.length === currentData.step3.length) {
                                setFeedback({ status: 'correct', message: "Bravo ! Les lunettes d'accord sont en place !" });
                            }
                        }
                    }
                    return;
                }

                // Étape 4 : Verbes
                if (currentStep === 4) {
                    setSelectedStep4(prev => prev.includes(word.id) ? prev.filter(id => id !== word.id) : [...prev, word.id]);
                    return;
                }

                // Étape 5 : GNS
                if (currentStep === 5) {
                    if (currentData.step5.gnsWords.includes(word.id)) {
                        setSelectedStep5(currentData.step5);
                        setFeedback({ status: 'correct', message: currentData.step5.answerText });
                        setTimeout(() => setShowConjugation(true), 600); // Délai pour voir le rouge
                    } else {
                        setFeedback({ status: 'incorrect', message: "Ce n'est pas le Sujet. Pose-toi la question : « " + currentData.step5.question + " »" });
                    }
                    return;
                }

                // Étape 6 : Doute orthographique
                if (currentStep === 6) {
                    let newSelected = [...selectedStep6];
                    if (newSelected.includes(word.id)) {
                        newSelected = newSelected.filter(id => id !== word.id);
                    } else {
                        newSelected.push(word.id);
                    }
                    setSelectedStep6(newSelected);

                    // Si le mot est un mot cible du dictionnaire
                    if (currentData.step6.includes(word.id) && currentData.dictionary && currentData.dictionary[word.id]) {
                        setCurrentDictWord(word.id);
                        setTimeout(() => setShowDictionary(true), 400);
                    }
                    
                    const foundTargetWords = newSelected.filter(id => currentData.step6.includes(id));
                    if (foundTargetWords.length >= currentData.step6.length) {
                        setFeedback({ status: 'correct', message: "Bravo ! Tu as validé tes doutes orthographiques. Tu peux cliquer sur Question." });
                    } else {
                        setFeedback({ status: 'idle', message: `Mots vérifiés : ${foundTargetWords.length} / ${currentData.step6.length}` });
                    }
                    return;
                }
            };

            const arraysEqual = (a, b) => {
                if (!a || !b || a.length !== b.length) return false;
                return [...a].sort().every((val, index) => val === [...b].sort()[index]);
            };

            const verifyStep = () => {
                if (currentStep === 1) {
                    if (arraysEqual(selectedStep1, currentData.step1)) setFeedback({ status: 'correct', message: "Excellent ! Majuscule et point trouvés." });
                    else setFeedback({ status: 'incorrect', message: "Attention, as-tu bien touché la Majuscule ET le point final ?" });
                } else if (currentStep === 2) {
                    const expectedWords = currentData.step2.flat();
                    const hasExtra = selectedStep2.some(id => !expectedWords.includes(id));
                    const missing = expectedWords.filter(id => !selectedStep2.includes(id));

                    if (arraysEqual(selectedStep2, expectedWords)) {
                        setFeedback({ status: 'correct', message: "Parfait ! Les Groupes du Nom sont complètement encadrés." });
                    } else if (hasExtra) {
                        setFeedback({ status: 'incorrect', message: "Attention, tu as sélectionné des mots qui ne font pas partie d'un GN." });
                    } else if (missing.length > 0) {
                        setFeedback({ status: 'incorrect', message: "Il manque des mots ! As-tu sélectionné TOUS les déterminants, adjectifs et noms ?" });
                    }
                } else if (currentStep === 4) {
                    if (arraysEqual(selectedStep4, currentData.step4)) setFeedback({ status: 'correct', message: "Très bien ! Le verbe conjugué est souligné." });
                    else setFeedback({ status: 'incorrect', message: "As-tu souligné uniquement l'action (le verbe) ?" });
                }
            };

            const handleNext = () => {
                if (currentStep < 6) setCurrentStep(currentStep + 1);
                else setShowReflection(true);
                setFeedback({ status: 'idle', message: '' });
            };

            const handleCompleteReflection = () => {
                setShowReflection(false);
                setSelectedStep1([]); setSelectedStep2([]); setSelectedStep3([]);
                setSelectedStep4([]); setSelectedStep5(null); setSelectedStep6([]);
                setCurrentDictWord(null); setShowDictionary(false); setShowConjugation(false);
                setFeedback({ status: 'idle', message: '' });
                setCurrentStep(1);
                setCurrentIndex(prev => prev + 1);
            };

            const renderSentence = () => {
                const elements = [];
                let i = 0;
                const words = currentData.words;

                while (i < words.length) {
                    const w = words[i];
                    if (w.gn !== null) {
                        const gnWords = words.filter(word => word.gn === w.gn);
                        elements.push(
                            <GNBlock 
                                key={`gn-${w.gn}`} words={gnWords} currentStep={currentStep}
                                selectedStep1={selectedStep1} selectedStep2={selectedStep2}
                                selectedStep3={selectedStep3} selectedStep4={selectedStep4}
                                selectedStep5={selectedStep5} selectedStep6={selectedStep6}
                                onWordClick={handleWordClick}
                            />
                        );
                        i += gnWords.length;
                    } else {
                        elements.push(
                            <span key={`word-${w.id}`} onClick={(e) => handleWordClick(w, e)} className={`cursor-pointer ${currentStep === 1 ? 'step1-active' : ''}`}>
                                <Word word={w} currentStep={currentStep} selectedStep1={selectedStep1} selectedStep2={selectedStep2} selectedStep4={selectedStep4} selectedStep5={selectedStep5} selectedStep6={selectedStep6} />
                            </span>
                        );
                        i++;
                    }
                }
                return elements;
            };

            const STEPS_INFO = {
                1: { title: "Étape 1 : Ponctuation", desc: "Touche la Majuscule du début et la ponctuation finale." },
                2: { title: "Étape 2 : Les GN", desc: "Touche TOUS les mots composant chaque Groupe du Nom (Dét+Nom+Adj)." },
                3: { title: "Étape 3 : Accords (Lunettes)", desc: "Touche le NOM NOYAU dans les cadres verts pour tracer tes lunettes !" },
                4: { title: "Étape 4 : Les Verbes", desc: "Touche le verbe conjugué pour le souligner en rouge." },
                5: { title: "Étape 5 : Accord du Verbe", desc: `Pose la question : « ${currentData.step5.question} » et touche le Sujet (GNS).` },
                6: { title: "Étape 6 : Le Doute", desc: "Touche les mots douteux. Retrouve tous les mots cibles pour valider !" }
            };

            const isStep6ReadyToNext = currentStep === 6 && selectedStep6.filter(id => currentData.step6.includes(id)).length >= currentData.step6.length;

            return (
                <div className="flex-1 flex flex-col w-full h-full bg-slate-50 relative">
                    
                    {/* Header Progress (Fixé en haut via flex-shrink-0) */}
                    <div className="bg-white px-4 py-4 shadow-sm z-10 flex flex-col sm:flex-row items-center justify-between border-b-2 border-indigo-100 shrink-0">
                        <div className="font-bold text-xl text-indigo-800 bg-indigo-50 px-4 py-2 rounded-xl mb-4 sm:mb-0 border border-indigo-100 flex items-center gap-2">
                            <Icon name="pen-tool" /> Phrase {currentIndex + 1} / {SENTENCES_DATA.length}
                        </div>
                        <div className="flex gap-2 overflow-x-auto max-w-full pb-1 px-2 no-scrollbar">
                            {[1,2,3,4,5,6].map((step) => {
                                const isCurrent = currentStep === step;
                                const isPast = currentStep > step;
                                return (
                                    <div key={step} className={`flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 rounded-full font-bold text-lg shadow-sm transition-all shrink-0 ${
                                        isCurrent ? 'bg-indigo-600 text-white scale-110 ring-4 ring-indigo-200' : 
                                        isPast ? 'bg-emerald-500 text-white' : 'bg-gray-200 text-gray-400'
                                    }`}>
                                        {isPast ? <Icon name="check" className="w-6 h-6" /> : step}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Zone Principale (Scrollable, prend tout l'espace restant) */}
                    <div className="flex-1 overflow-y-auto p-4 sm:p-8 flex flex-col items-center justify-start pb-8">
                        <div className="w-full max-w-5xl">
                            <div className="text-center mb-8">
                                <h3 className="text-3xl sm:text-4xl font-extrabold text-indigo-900 mb-2">{STEPS_INFO[currentStep].title}</h3>
                                <p className="text-xl sm:text-2xl text-gray-600 font-medium">{STEPS_INFO[currentStep].desc}</p>
                                
                                {currentStep === 5 && (
                                    <div className="mt-4 bg-red-100 border-2 border-red-300 text-red-900 rounded-2xl p-3 px-6 font-bold text-2xl inline-block shadow-sm">
                                        ® {currentData.step5.question}
                                    </div>
                                )}
                            </div>

                            <div className="bg-white rounded-3xl shadow-xl p-8 sm:p-14 min-h-[300px] border-4 border-white flex flex-col justify-center items-center relative z-0">
                                <div className="text-3xl sm:text-4xl md:text-6xl leading-[4rem] sm:leading-[6rem] text-center font-medium select-none w-full relative">
                                    {renderSentence()}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Barre de contrôle (Fixée en bas via flex-shrink-0) */}
                    <div className="shrink-0 bg-white border-t-2 border-gray-200 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] p-4 sm:p-6 z-20">
                        <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className={`flex-1 w-full rounded-2xl p-4 flex items-center gap-4 transition-all border-2 ${
                                feedback.status === 'idle' ? 'bg-indigo-50 text-indigo-800 border-indigo-100' :
                                feedback.status === 'correct' ? 'bg-emerald-100 text-emerald-900 border-emerald-400' :
                                'bg-red-50 text-red-900 border-red-300'
                            }`}>
                                {feedback.status === 'correct' && <div className="bg-emerald-500 text-white rounded-full p-2"><Icon name="check" /></div>}
                                {feedback.status === 'incorrect' && <div className="bg-red-500 text-white rounded-full p-2"><Icon name="x" /></div>}
                                
                                <div className="flex-1">
                                    <p className="text-lg sm:text-xl md:text-2xl font-bold whitespace-pre-wrap leading-tight">
                                        {feedback.status === 'idle' && (
                                            (currentStep === 1 && selectedStep1.length > 0) || (currentStep === 2 && selectedStep2.length > 0) || (currentStep === 4 && selectedStep4.length > 0) ? "Vérifie ta réponse !" : 
                                            currentStep === 3 ? "Touche les Noms Noyaux !" :
                                            currentStep === 5 ? "Touche le sujet (GNS) !" :
                                            currentStep === 6 ? "Touche un mot pour placer l'étoile ★" : "À toi de jouer !"
                                        )}
                                        {feedback.status !== 'idle' && feedback.message}
                                    </p>
                                </div>
                            </div>

                            <div className="flex gap-4 w-full sm:w-auto shrink-0">
                                {(feedback.status === 'correct' || isStep6ReadyToNext) && !showDictionary && !showConjugation ? (
                                    <button onClick={handleNext} className="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-4 px-8 rounded-2xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-3 text-xl">
                                        {currentStep === 6 ? "Question finale" : "Suivant"} <Icon name="arrowRight" />
                                    </button>
                                ) : (
                                    <>
                                        {currentStep !== 3 && currentStep !== 5 && currentStep !== 6 && (
                                            <button 
                                                onClick={verifyStep}
                                                disabled={(currentStep===1&&selectedStep1.length===0)||(currentStep===2&&selectedStep2.length===0)||(currentStep===4&&selectedStep4.length===0)}
                                                className={`w-full sm:w-auto font-extrabold py-4 px-10 rounded-2xl transition text-xl ${
                                                    ((currentStep===1&&selectedStep1.length>0)||(currentStep===2&&selectedStep2.length>0)||(currentStep===4&&selectedStep4.length>0))
                                                        ? "bg-indigo-600 hover:bg-indigo-700 text-white active:scale-95 shadow-lg" 
                                                        : "bg-gray-200 text-gray-400 cursor-not-allowed"
                                                }`}
                                            >
                                                Vérifier
                                            </button>
                                        )}
                                    </>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* MODAL DICTIONNAIRE */}
                    {showDictionary && currentDictWord !== null && currentData.dictionary[currentDictWord] && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full max-h-full overflow-y-auto shadow-2xl border-4 border-purple-200 slide-up">
                                <div className="flex items-center gap-3 mb-6 border-b-2 border-purple-100 pb-4">
                                    <div className="p-3 bg-purple-100 text-purple-700 rounded-2xl"><Icon name="book-open" className="w-8 h-8" /></div>
                                    <div>
                                        <h3 className="text-3xl font-black text-purple-900">{currentData.dictionary[currentDictWord].word}</h3>
                                        <span className="text-sm font-bold text-purple-600 uppercase tracking-wider">Usito / Dictionnaire</span>
                                    </div>
                                </div>
                                <div className="space-y-4 text-gray-700 text-lg">
                                    <div className="flex gap-2"><span className="font-bold text-gray-900">Classe :</span><span className="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm font-bold">{currentData.dictionary[currentDictWord].class}</span></div>
                                    <div className="flex gap-2"><span className="font-bold text-gray-900">Genre / Nombre :</span><span className="text-gray-600 font-medium">{currentData.dictionary[currentDictWord].gender} {currentData.dictionary[currentDictWord].number}</span></div>
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 mt-4">
                                        <span className="font-bold text-gray-900 block mb-1">Définition :</span>
                                        <p className="text-gray-700 font-medium leading-relaxed">{currentData.dictionary[currentDictWord].def}</p>
                                    </div>
                                </div>
                                <button onClick={() => setShowDictionary(false)} className="mt-8 w-full bg-purple-600 hover:bg-purple-700 text-white font-black py-4 rounded-2xl text-xl shadow-lg transition active:scale-95 shrink-0">
                                    J'ai compris !
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODAL CONJUGAISON */}
                    {showConjugation && currentData.step5.conjugation && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full max-h-full overflow-y-auto shadow-2xl border-4 border-red-200 slide-up">
                                <div className="text-center mb-4 border-b-2 border-red-100 pb-4">
                                    <h3 className="text-3xl font-black text-red-900 capitalize">{currentData.step5.conjugation.infinitive}</h3>
                                    <span className="text-sm font-bold text-red-600 uppercase tracking-wider block mt-1">{currentData.step5.conjugation.tense}</span>
                                </div>
                                <div className="space-y-2 text-xl font-medium text-gray-700 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                    {currentData.step5.conjugation.forms.map((form, idx) => (
                                        <div key={idx} className={`flex justify-center gap-3 ${form.isTarget ? 'text-red-700 font-black scale-110 bg-red-100 rounded-lg py-2 my-1 shadow-sm' : ''}`}>
                                            <span className="w-24 text-right">{form.pronoun}</span>
                                            <span className="w-24 text-left">{form.verb}</span>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setShowConjugation(false)} className="mt-6 w-full bg-red-500 hover:bg-red-600 text-white font-black py-4 rounded-2xl text-xl shadow-lg transition active:scale-95 shrink-0">
                                    Fermer
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODAL REFLEXION */}
                    {showReflection && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 fade-in">
                            <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-2xl w-full shadow-2xl border-4 border-indigo-200 slide-up flex flex-col max-h-full">
                                
                                <div className="text-center mb-4 shrink-0 flex items-center justify-center gap-4">
                                    <div className="w-14 h-14 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center shadow-sm">
                                        <Icon name="lightbulb" className="w-8 h-8" />
                                    </div>
                                    <h3 className="text-3xl font-black text-indigo-900">Minute de réflexion</h3>
                                </div>

                                <div className="flex-1 overflow-y-auto no-scrollbar pb-2">
                                    <p className="text-xl sm:text-2xl font-bold text-gray-800 mb-6 text-center leading-snug">
                                        {currentData.reflection.question}
                                    </p>

                                    <div className="space-y-3 mb-4">
                                        {currentData.reflection.options.map((option, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => {
                                                    if (idx === currentData.reflection.answer) setFeedback({ status: 'correct', message: currentData.reflection.explanation });
                                                    else setFeedback({ status: 'incorrect', message: "Ce n'est pas tout à fait ça. Essaie l'autre choix !" });
                                                }}
                                                className="w-full text-left p-4 rounded-xl border-2 border-indigo-100 hover:border-indigo-400 hover:bg-indigo-50 font-bold text-lg text-gray-700 transition shadow-sm"
                                            >
                                                {option}
                                            </button>
                                        ))}
                                    </div>

                                    {feedback.status === 'correct' && (
                                        <div className="bg-emerald-50 text-emerald-900 p-4 rounded-xl font-bold text-lg border-2 border-emerald-300 shadow-inner slide-up">
                                            ✅ {feedback.message}
                                        </div>
                                    )}
                                </div>

                                <button
                                    onClick={handleCompleteReflection}
                                    disabled={feedback.status !== 'correct'}
                                    className={`mt-4 w-full font-black py-4 rounded-xl text-xl transition shrink-0 ${
                                        feedback.status === 'correct'
                                            ? 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-[0_4px_20px_rgb(16,185,129,0.4)] active:scale-95'
                                            : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                    }`}
                                >
                                    Passer à la phrase suivante
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('discovery');

            return (
                <div className="h-full flex flex-col w-full relative">
                    <header className="bg-indigo-900 text-white py-3 px-6 shadow-md flex justify-between items-center shrink-0 z-30">
                        <div className="flex items-center gap-3">
                            <div className="bg-amber-400 text-indigo-950 p-2 rounded-xl font-black text-2xl flex items-center justify-center">
                                CC
                            </div>
                            <h1 className="text-2xl font-black tracking-wide">
                                Code de Correction <span className="text-amber-400 font-medium text-lg hidden sm:inline ml-2">| PFEQ</span>
                            </h1>
                        </div>
                        <div className="flex gap-2">
                            <button
                                onClick={() => setActiveTab('discovery')}
                                className={`px-4 py-2 rounded-xl font-bold transition flex gap-2 items-center ${
                                    activeTab === 'discovery' ? 'bg-white text-indigo-900 shadow-md' : 'text-indigo-200 hover:bg-indigo-800'
                                }`}
                            >
                                <Icon name="book-open" className="w-5 h-5" />
                                <span className="hidden sm:inline">La Méthode</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('simulator')}
                                className={`px-4 py-2 rounded-xl font-bold transition flex gap-2 items-center ${
                                    activeTab === 'simulator' ? 'bg-amber-400 text-indigo-950 shadow-md' : 'text-indigo-200 hover:bg-indigo-800'
                                }`}
                            >
                                <Icon name="play-circle" className="w-5 h-5" />
                                <span className="hidden sm:inline">Entraînement</span>
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col overflow-hidden relative w-full">
                        {activeTab === 'discovery' && <DiscoveryTab onStartSimulator={() => setActiveTab('simulator')} />}
                        {activeTab === 'simulator' && <SimulatorTab onFinish={() => setActiveTab('discovery')} />}
                    </main>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
